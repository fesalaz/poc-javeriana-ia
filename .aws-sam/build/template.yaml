AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "PoC \"Asistente Javeriana IA\" \u2014 despliegue de referencia en capa\
  \ gratuita de AWS, siguiendo la vista de despliegue documentada en las Iteraciones\
  \ 1 y 3 del dise\xF1o ADD 3.0 (arquitectura-add30-javeriana.md). No desplegado ni\
  \ validado contra una cuenta real de AWS en este entorno (sin credenciales) \u2014\
  \ revisar con `sam validate` y `sam build` antes de `sam deploy`.\n"
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: "VPC donde se crear\xE1 la base de datos (puede ser la VPC default)."
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: "Al menos 2 subredes en distintas AZ (requerido por RDS DBSubnetGroup,\
      \ aunque el PoC use una sola instancia sin Multi-AZ; ver Iteraci\xF3n 3, trade-off\
      \ C5 vs QAS-D2)."
  DBAllowedCidr:
    Type: String
    Default: '0.0.0.0/0'
    Description: "CIDR permitido para conectarse a PostgreSQL. Para el PoC se deja\
      \ abierto por simplicidad (evita el costo de un NAT Gateway al no meter el Lambda\
      \ en la VPC), PERO esto es una concesi\xF3n de seguridad SOLO aceptable en un\
      \ PoC acad\xE9mico temporal \u2014 en producci\xF3n, restringir a security groups\
      \ espec\xEDficos o mover todo a una VPC privada con NAT/VPC endpoints. Ver Iteraci\xF3\
      n 7 (QAS-S2).\n"
  DBUsername:
    Type: String
    Default: javeriana_app
  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
  GoogleApiKey:
    Type: String
    NoEcho: true
    Description: "API key gratuita de Google AI Studio (Gemini) \u2014 proveedor 1\
      \ (primario)."
  OpenAiOssApiKey:
    Type: String
    NoEcho: true
    Description: "API key gratuita de Groq, usada para el modelo openai/gpt-oss-20b\
      \ \u2014 proveedor 2."
  OpenAiOssBaseUrl:
    Type: String
    Default: https://api.groq.com/openai/v1
  OpenAiOssModel:
    Type: String
    Default: openai/gpt-oss-20b
  LlamaApiKey:
    Type: String
    NoEcho: true
    Description: "API key de OpenRouter para Meta Llama 3.3 \u2014 proveedor 3. Usa\
      \ el modelo de PAGO (LlamaModel de abajo): el slug \":free\" de este modelo\
      \ dej\xF3 de estar disponible en la pr\xE1ctica en OpenRouter (404 \"This model\
      \ is unavailable for free\"), aunque el cat\xE1logo web lo siga mostrando como\
      \ \"Free\". Requiere cr\xE9ditos cargados en la cuenta de OpenRouter. Ver GUIA_DESPLIEGUE_Y_PRUEBAS.md\
      \ secci\xF3n 0.1."
  LlamaBaseUrl:
    Type: String
    Default: https://openrouter.ai/api/v1
  GeminiModel:
    Type: String
    Default: gemini-3.5-flash
  GeminiEmbeddingModel:
    Type: String
    Default: models/gemini-embedding-001
  LlamaModel:
    Type: String
    Default: meta-llama/llama-3.3-70b-instruct
  BedrockEmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
    Description: "Respaldo 1 de embed() (septiembre 2026, hallazgo R-7 de EVALUACION_ATAM_LITE.md).\
      \ No requiere API key: usa el rol de ejecuci\xF3n de QueryFunction (ver el permiso\
      \ bedrock:InvokeModel m\xE1s abajo)."
  VoyageApiKey:
    Type: String
    NoEcho: true
    Description: "Respaldo 2 de embed() (Voyage AI, https://dash.voyageai.com/ \u2014\
      \ 200M tokens gratis por cuenta). Proveedor independiente de AWS, para no depender\
      \ de un \xFAnico cloud si Bedrock tambi\xE9n tuviera una degradaci\xF3n."
  VoyageModel:
    Type: String
    Default: voyage-4-lite
  VoyageBaseUrl:
    Type: String
    Default: https://api.voyageai.com/v1
Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      AccessControl: Private
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: javeriana-ia-poc-users
      AutoVerifiedAttributes:
      - email
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireUppercase: true
          RequireNumbers: true
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId:
        Ref: UserPool
      ClientName: javeriana-ia-poc-client
      GenerateSecret: false
      ExplicitAuthFlows:
      - ALLOW_USER_PASSWORD_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
  JaverianaApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn:
              Fn::GetAtt:
              - UserPool
              - Arn
  CAGTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: javeriana-ia-cag-cache
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: course_id
        AttributeType: S
      KeySchema:
      - AttributeName: course_id
        KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true
  LLMSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: javeriana-ia-poc/llm-provider-keys
      Description: "Credenciales de los proveedores de generate() (Gemini, OpenAI\
        \ gpt-oss-20b/Groq, Llama 3.3/OpenRouter), de Voyage AI (respaldo 2 de embed(),\
        \ septiembre 2026 \u2014 ver R-7 en EVALUACION_ATAM_LITE.md) y la contrase\xF1\
        a de PostgreSQL. AWS Bedrock (respaldo 1 de embed()) NO necesita credencial\
        \ aqu\xED: usa el rol de ejecuci\xF3n de QueryFunction. lambda_handler.py\
        \ lee este secreto en cada cold start (_load_secrets_into_env(), gen\xE9rico:\
        \ vierte cada clave del JSON como variable de entorno) y arma POSTGRES_URL\
        \ con la contrase\xF1a (_build_postgres_url())."
      SecretString:
        Fn::Sub: '{"GOOGLE_API_KEY":"${GoogleApiKey}","OPENAI_OSS_API_KEY":"${OpenAiOssApiKey}","LLAMA_API_KEY":"${LlamaApiKey}","VOYAGE_API_KEY":"${VoyageApiKey}","POSTGRES_PASSWORD":"${DBPassword}"}

          '
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subredes para la instancia RDS del PoC.
      SubnetIds:
        Ref: SubnetIds
  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Acceso a PostgreSQL del PoC (ver nota de DBAllowedCidr).
      VpcId:
        Ref: VpcId
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 5432
        ToPort: 5432
        CidrIp:
          Ref: DBAllowedCidr
  PostgresDB:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: '16'
      DBInstanceClass: db.t3.micro
      AllocatedStorage: '20'
      StorageType: gp2
      DBName: javeriana_ia
      MasterUsername:
        Ref: DBUsername
      MasterUserPassword:
        Ref: DBPassword
      DBSubnetGroupName:
        Ref: DBSubnetGroup
      VPCSecurityGroups:
      - Ref: DBSecurityGroup
      PubliclyAccessible: true
      MultiAZ: false
      StorageEncrypted: true
      BackupRetentionPeriod: 7
      DeletionProtection: false
  QueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: javeriana-ia-poc-query
      Runtime: python3.13
      Handler: lambda_handler.handler
      CodeUri: QueryFunction
      MemorySize: 1024
      Timeout: 28
      Environment:
        Variables:
          USE_REAL_LLM_PROVIDERS: 'true'
          LLM_REQUEST_TIMEOUT_SECONDS: '6'
          GEMINI_MODEL:
            Ref: GeminiModel
          GEMINI_EMBEDDING_MODEL:
            Ref: GeminiEmbeddingModel
          OPENAI_OSS_MODEL:
            Ref: OpenAiOssModel
          OPENAI_OSS_BASE_URL:
            Ref: OpenAiOssBaseUrl
          LLAMA_MODEL:
            Ref: LlamaModel
          LLAMA_BASE_URL:
            Ref: LlamaBaseUrl
          BEDROCK_EMBEDDING_MODEL_ID:
            Ref: BedrockEmbeddingModelId
          VOYAGE_MODEL:
            Ref: VoyageModel
          VOYAGE_BASE_URL:
            Ref: VoyageBaseUrl
          SECRETS_ARN:
            Ref: LLMSecrets
          DYNAMO_TABLE_NAME:
            Ref: CAGTable
          POSTGRES_HOST:
            Fn::GetAtt:
            - PostgresDB
            - Endpoint.Address
          POSTGRES_PORT:
            Fn::GetAtt:
            - PostgresDB
            - Endpoint.Port
          POSTGRES_DB: javeriana_ia
          POSTGRES_USER:
            Ref: DBUsername
          POSTGRES_CONNECT_TIMEOUT_SECONDS: '5'
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: CAGTable
      - Statement:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource:
            Ref: LLMSecrets
      - Statement:
        - Effect: Allow
          Action: bedrock:InvokeModel
          Resource:
            Fn::Sub: arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockEmbeddingModelId}
      Events:
        QueryApi:
          Type: Api
          Properties:
            RestApiId:
              Ref: JaverianaApi
            Path: /query
            Method: post
        CreateCourseApi:
          Type: Api
          Properties:
            RestApiId:
              Ref: JaverianaApi
            Path: /courses
            Method: post
        ListCoursesApi:
          Type: Api
          Properties:
            RestApiId:
              Ref: JaverianaApi
            Path: /courses
            Method: get
        AssignTeacherApi:
          Type: Api
          Properties:
            RestApiId:
              Ref: JaverianaApi
            Path: /courses/{courseId}/teachers
            Method: post
        EnrollStudentApi:
          Type: Api
          Properties:
            RestApiId:
              Ref: JaverianaApi
            Path: /courses/{courseId}/students
            Method: post
        PublishMaterialApi:
          Type: Api
          Properties:
            RestApiId:
              Ref: JaverianaApi
            Path: /courses/{courseId}/material
            Method: post
    Metadata:
      SamResourceId: QueryFunction
  QueryFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Errores del Orquestador \u2014 insumo de disponibilidad (QAS-D1/D3)."
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
      - Name: FunctionName
        Value:
          Ref: QueryFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  QueryFunctionLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Latencia alta del Orquestador \u2014 insumo de desempe\xF1\
        o (QAS-P1/P3)."
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
      - Name: FunctionName
        Value:
          Ref: QueryFunction
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 1
      Threshold: 8000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
Outputs:
  ApiUrl:
    Description: "URL del endpoint POST /query (API Gateway). Requiere un JWT de Cognito\
      \ v\xE1lido en el header Authorization: Bearer <token> \u2014 ver GUIA_DESPLIEGUE_Y_PRUEBAS.md,\
      \ secci\xF3n 6.6, para obtenerlo.\n"
    Value:
      Fn::Sub: https://${JaverianaApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/query
  ApiBaseUrl:
    Description: "URL base de la API (sin /query) \u2014 a partir de ac\xE1 cuelgan\
      \ tambi\xE9n las rutas de gesti\xF3n de cursos (FR5): POST /courses, GET /courses?userId=...,\
      \ POST /courses/{courseId}/teachers, POST /courses/{courseId}/students, POST\
      \ /courses/{courseId}/material. Las 6 rutas (esta base + /query) requieren el\
      \ mismo header Authorization: Bearer <token> de Cognito. Ver GUIA_DESPLIEGUE_Y_PRUEBAS.md,\
      \ secciones 6.5 y 6.6.\n"
    Value:
      Fn::Sub: https://${JaverianaApi}.execute-api.${AWS::Region}.amazonaws.com/Prod
  UserPoolId:
    Description: "\xDAsalo para crear usuarios de prueba (ver GUIA secci\xF3n 6.6)."
    Value:
      Ref: UserPool
  UserPoolClientId:
    Description: ClientId para autenticar (aws cognito-idp initiate-auth) y obtener
      el token.
    Value:
      Ref: UserPoolClient
  CAGTableName:
    Value:
      Ref: CAGTable
  PostgresEndpoint:
    Value:
      Fn::GetAtt:
      - PostgresDB
      - Endpoint.Address
  FrontendBucketName:
    Value:
      Ref: FrontendBucket
  LLMSecretsArn:
    Value:
      Ref: LLMSecrets
